    <!-- Compatibility Patch for KaTeX in quirks mode environments -->
    <script>
      try {
        // KaTeX requires CSS1Compat (Standards Mode). 
        // If the environment forces BackCompat (Quirks Mode), we monkey-patch it to fool KaTeX.
        if (document.compatMode === 'BackCompat') {
          Object.defineProperty(document, 'compatMode', {
            get: function() { return 'CSS1Compat'; },
            configurable: true
          });
        }
      } catch(e) { console.warn('Compat patch failed', e); }
    </script>
